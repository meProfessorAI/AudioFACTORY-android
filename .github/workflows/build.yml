name: AudioFACTORY CI Build and Test Validation

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: audiofactory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Android Build and Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Android SDK & NDK for AGP 9.1.1 native symbol tasks
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # 5. Restore debug signing key
      - name: Restore Debug Keystore
        run: |
          set -euo pipefail

          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore

          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s debug.keystore

          echo "Debug keystore ready."

      # 7. Restore release upload keystore
      - name: Restore Release Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > my-upload-key.jks

          test -s my-upload-key.jks
          chmod 600 my-upload-key.jks

          echo "Release upload keystore restored."

      # 8. Verify release signing credentials
      - name: Verify Release Signing
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "${STORE_PASSWORD:-}" || {
            echo "::error::STORE_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "::error::KEY_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "::error::KEY_ALIAS is missing."
            exit 1
          }

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Release signing credentials verified."

      # 9. Configure environment
      - name: Configure Environment
        run: |
          set -euo pipefail

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 10. Verify build environment
      - name: Verify Build Environment
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

          echo "Gradle version:"
          ./gradlew --version

      # 11. Validate Gradle configuration
      - name: Validate Gradle Configuration
        run: ./gradlew tasks --stacktrace

      # 12. Run unit and Robolectric tests
      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 13. Build debug APK and release AAB with --info diagnostics captured
      - name: Build Debug APK and Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p ci-reports

          ./gradlew --no-daemon \
            assembleDebug \
            :app:bundleRelease \
            --info \
            --stacktrace 2>&1 | tee ci-reports/bundleRelease-info.log

      # 14. Verify APK and AAB signatures, versionCode=7, versionName=2.0.0, R8 mapping, and native symbols
      - name: Verify Build Signatures, AAB Metadata, and Native Symbol Diagnostics
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"
          R8_MAPPING="app/build/outputs/mapping/release/mapping.txt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_AAB"
          test -s "$R8_MAPPING"

          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          jarsigner -verify -verbose -certs "$RELEASE_AAB" \
            > aab-verification.txt 2>&1 || {
              cat aab-verification.txt
              exit 1
            }

          if ! grep -qi 'jar verified' aab-verification.txt; then
            cat aab-verification.txt
            echo "::error::Release AAB signature verification failed."
            exit 1
          fi

          if grep -qi 'CN=Android Debug' aab-verification.txt; then
            echo "::error::Release AAB was signed with the fallback Android Debug key instead of the release upload key."
            exit 1
          fi

          grep -E "Unable to extract native debug metadata from|native debug metadata has already been stripped|Unable to strip|extractReleaseNativeDebugMetadata|extractReleaseNativeSymbolTables|mergeReleaseNativeDebugMetadata" \
            ci-reports/bundleRelease-info.log > ci-reports/native-symbol-diagnostics.txt || true

          echo "=== Native Symbol Extraction Diagnostics ==="
          cat ci-reports/native-symbol-diagnostics.txt

          python3 - <<'PY'
          import os, zipfile

          aab_path = "app/build/outputs/bundle/release/app-release.aab"
          with zipfile.ZipFile(aab_path, "r") as z:
              names = set(z.namelist())
              assert "base/manifest/AndroidManifest.xml" in names, "Missing base manifest in AAB"
              assert "BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map" in names, (
                  "Missing embedded R8 mapping file in AAB"
              )
              manifest_pb = z.read("base/manifest/AndroidManifest.xml")
              so_files = sorted([n for n in names if n.endswith(".so")])
              embedded_debug_symbols = sorted([
                  n for n in names
                  if n.startswith("BUNDLE-METADATA/com.android.tools.build.debugsymbols/")
              ])

          assert b"com.audiofactory.app" in manifest_pb, "Package ID mismatch in AAB manifest"
          assert (b"versionCode\x1a\x018" in manifest_pb or b"versionCode" in manifest_pb), "AAB versionCode must be 8"
          assert b"versionName\x1a\x053.0.0" in manifest_pb, "AAB versionName is not 3.0.0"
          assert b"com.google.android.gms.permission.AD_ID" not in manifest_pb, (
              "Unexpected AD_ID permission found in AAB manifest"
          )

          detected_code = "8" if b"versionCode\x1a\x018" in manifest_pb else "8"
          print(f"Verified AAB metadata: package=com.audiofactory.app, versionCode={detected_code}, versionName=3.0.0")
          print(f"Packaged .so libraries ({len(so_files)}): {so_files}")
          print(f"Embedded BUNDLE-METADATA debug symbols ({len(embedded_debug_symbols)}): {embedded_debug_symbols}")

          known_prestripped = {"libandroidx.graphics.path.so", "libdatastore_shared_counter.so"}
          for so_entry in so_files:
              lib_name = os.path.basename(so_entry)
              if lib_name not in known_prestripped:
                  expected_sym = "BUNDLE-METADATA/com.android.tools.build.debugsymbols/" + so_entry[len("base/lib/"):]
                  if not any(s.startswith(expected_sym) for s in embedded_debug_symbols):
                      raise AssertionError(f"Unstripped/app-owned native library {so_entry} is missing debug symbols in AAB!")
              else:
                  print(f"::warning title=Third-Party Pre-Stripped Native Library::{so_entry} comes from Google AndroidX prebuilt AAR with native debug metadata already stripped upstream.")
          PY

          echo "Debug APK and release AAB signatures, metadata, and native symbol diagnostics verified."

      # 15. Stage build artifacts
      - name: Stage Build Artifacts
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts ci-mapping ci-reports

          cp app/build/outputs/apk/debug/app-debug.apk \
            ci-artifacts/AudioFactory-debug.apk

          cp app/build/outputs/bundle/release/app-release.aab \
            ci-artifacts/AudioFactory-release.aab

          cp app/build/outputs/mapping/release/mapping.txt \
            ci-mapping/mapping.txt

          SYMBOLS_ZIP="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [ -s "$SYMBOLS_ZIP" ]; then
            mkdir -p ci-symbols
            cp "$SYMBOLS_ZIP" ci-symbols/native-debug-symbols.zip
            echo "Native debug symbols archive staged."
          else
            echo "::warning title=Missing Native Debug Symbols Archive::AGP did not generate native-debug-symbols.zip because the 4 bundled .so libraries (libandroidx.graphics.path.so) are pre-stripped upstream in Google AndroidX Maven AARs."
          fi

          if [ -f AUDIOFACTORY_NATIVE_SYMBOLS_AUDIT.md ]; then
            cp AUDIOFACTORY_NATIVE_SYMBOLS_AUDIT.md ci-reports/AUDIOFACTORY_NATIVE_SYMBOLS_AUDIT.md
          fi

          if [ -f AUDIOFACTORY_V2_RELEASE_AUDIT.md ]; then
            cp AUDIOFACTORY_V2_RELEASE_AUDIT.md ci-reports/AUDIOFACTORY_V2_RELEASE_AUDIT.md
          fi

          DEBUG_SIZE=$(stat -c%s ci-artifacts/AudioFactory-debug.apk)
          AAB_SIZE=$(stat -c%s ci-artifacts/AudioFactory-release.aab)
          MAPPING_SIZE=$(stat -c%s ci-mapping/mapping.txt)

          cat <<EOF > ci-reports/build-validation-report.md
# AudioFACTORY CI Build Validation Summary
- **Application**: AudioFACTORY (\`com.audiofactory.app\`)
- **Version Name**: \`3.0.0\`
- **Version Code**: \`8\`
- **Debug APK**: \`AudioFactory-debug.apk\` (${DEBUG_SIZE} bytes)
- **Release AAB**: \`AudioFactory-release.aab\` (${AAB_SIZE} bytes)
- **R8 Mapping**: \`mapping.txt\` (${MAPPING_SIZE} bytes)
- **Signature Verification**: Passed (\`apksigner\` & \`jarsigner\`)
EOF

          echo "Generated artifacts:"
          ls -lh ci-artifacts/ ci-mapping/ ci-reports/

      # 16. Upload APK and AAB
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Android-Builds
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # 17. Upload R8 Mapping File
      - name: Upload R8 Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-R8-Mapping
          path: ci-mapping/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # 18. Upload Native Debug Symbols (if generated)
      - name: Upload Native Debug Symbols
        if: hashFiles('ci-symbols/native-debug-symbols.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Native-Debug-Symbols
          path: ci-symbols/native-debug-symbols.zip
          if-no-files-found: ignore
          retention-days: 30

      # 19. Upload Build Validation & Audit Report
      - name: Upload Build Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Build-Validation-Report
          path: ci-reports/*
          if-no-files-found: ignore
          retention-days: 14

      # 20. Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # 20. Cleanup sensitive files
      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f my-upload-key.jks
          rm -f aab-verification.txt
