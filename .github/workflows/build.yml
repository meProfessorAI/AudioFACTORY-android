name: AudioFACTORY CI Build and Test Validation

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: audiofactory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Android Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # 5. Firebase configuration
      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 secret."
            exit 1
          fi

          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

          python3 - <<'PY'
          import json

          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)

          assert config["project_info"]["project_id"] == "audiofactory-eia", \
              "Incorrect Firebase project"

          matching = [
              c for c in config["client"]
              if c["client_info"]["android_client_info"]["package_name"]
              == "com.audiofactory.app"
          ]

          assert matching, "Android package not found"

          web_clients = [
              oauth
              for client in matching
              for oauth in client.get("oauth_client", [])
              if oauth.get("client_type") == 3
          ]

          assert web_clients, "Web OAuth client missing"

          print("Firebase configuration verified successfully.")
          PY

      # 6. Debug signing
      - name: Restore Debug Keystore
        run: |
          set -euo pipefail

          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s debug.keystore

      # 7. Release signing
      - name: Restore Release Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks
          chmod 600 my-upload-key.jks

      # 8. Verify signing secrets
      - name: Verify Release Signing
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "${STORE_PASSWORD:-}" || {
            echo "::error::STORE_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "::error::KEY_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "::error::KEY_ALIAS is missing."
            exit 1
          }

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Release keystore verified."

      # 9. Environment
      - name: Configure Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 10. Unit tests
      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 11. Build APK and signed AAB
      - name: Build Debug APK and Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug bundleRelease --stacktrace

      # 12. Verify release bundle signature
      - name: Verify Release AAB
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"

      # 13. Stage artifacts
      - name: Stage Build Artifacts
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts

          cp app/build/outputs/apk/debug/app-debug.apk \
            ci-artifacts/AudioFactory-debug.apk

          cp app/build/outputs/bundle/release/app-release.aab \
            ci-artifacts/AudioFactory-release.aab

          echo "Build artifacts:"
          ls -lh ci-artifacts/

      # 14. Upload APK and AAB
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Android-Builds
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # 15. Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # 16. Cleanup
      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f my-upload-key.jks
