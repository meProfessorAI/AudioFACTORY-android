name: Build Debug APK & App Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release_bundle:
        description: 'Attempt Release Bundle build if signing secrets exist'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew Executable
        run: chmod +x ./gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Setup Environment Configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK & App Bundle
        run: ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Build Release Bundle (Optional if Keystore Configured)
        if: ${{ inputs.build_release_bundle == true || env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew bundleRelease --stacktrace
            echo "Release bundle built successfully."
          else
            echo "No release keystore secret found. Skipping bundleRelease."
          fi

      - name: Stage Artifacts
        run: |
          mkdir -p staged-artifacts
          find app/build/outputs/apk -name "*.apk" -type f -exec cp -v {} staged-artifacts/ \; 2>/dev/null || true
          find app/build/outputs/bundle -name "*.aab" -type f -exec cp -v {} staged-artifacts/ \; 2>/dev/null || true
          
          echo "=== Staged Artifacts ==="
          ls -lh staged-artifacts/
          
          echo "### Build Artifacts Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Type | File Name | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in staged-artifacts/*; do
            if [ -f "$file" ]; then
              FNAME=$(basename "$file")
              FSIZE=$(du -h "$file" | cut -f1)
              case "$FNAME" in
                *.apk) TYPE="Android APK" ;;
                *.aab) TYPE="Android App Bundle" ;;
                *) TYPE="Output File" ;;
              esac
              echo "| $TYPE | \`$FNAME\` | $FSIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-factory-debug-apk
          path: staged-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-factory-app-bundle
          path: staged-artifacts/*.aab
          if-no-files-found: warn
          retention-days: 30
