name: CI Build & Test Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew Executable
        run: chmod +x ./gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Environment Configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK & Debug AAB
        run: ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Stage CI Artifacts
        run: |
          mkdir -p ci-artifacts
          
          RAW_DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_DEBUG_AAB="app/build/outputs/bundle/debug/app-debug.aab"
          
          if [ -s "$RAW_DEBUG_APK" ]; then
            cp -v "$RAW_DEBUG_APK" ci-artifacts/AudioFactory-debug.apk
          fi
          
          if [ -s "$RAW_DEBUG_AAB" ]; then
            cp -v "$RAW_DEBUG_AAB" ci-artifacts/AudioFactory-debug.aab
          fi

          echo "=== Staged CI Artifacts ==="
          ls -lh ci-artifacts/

      - name: Upload Debug APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio-factory-debug-apk-and-aab
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
