name: AudioFACTORY CI Build & Test Validation

on:
push:
branches: [main, master]
pull_request:
branches: [main, master]
workflow_dispatch:

concurrency:
group: ci-${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

permissions:
contents: read

jobs:
validate:
name: Build, Test & Package Android
runs-on: ubuntu-latest
timeout-minutes: 35

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-36
        build-tools;36.0.0

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Ensure Gradle Wrapper Executable
    run: chmod +x ./gradlew

  - name: Restore Firebase Configuration
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    run: |
      set -euo pipefail

      if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
        echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 GitHub secret."
        exit 1
      fi

      mkdir -p app
      printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      if [ ! -s app/google-services.json ]; then
        echo "::error::Firebase configuration is empty."
        exit 1
      fi

      python3 - <<'PY'
      import json

      path = "app/google-services.json"

      with open(path, encoding="utf-8") as f:
          config = json.load(f)

      assert config["project_info"]["project_id"] == "audiofactory-eia"

      clients = config["client"]
      matching = [
          c for c in clients
          if c["client_info"]["android_client_info"]["package_name"]
          == "com.audiofactory.app"
      ]

      assert matching, "Android package com.audiofactory.app not found"

      web_clients = [
          oauth
          for client in matching
          for oauth in client.get("oauth_client", [])
          if oauth.get("client_type") == 3
      ]

      assert web_clients, "Web OAuth client (type 3) is missing"

      print("Firebase project, Android package and Web OAuth client verified.")
      PY

  - name: Restore Debug Keystore
    run: |
      set -euo pipefail

      if [ -f debug.keystore.base64 ]; then
        base64 --decode debug.keystore.base64 > debug.keystore
      elif [ ! -f debug.keystore ]; then
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
      fi

      test -s debug.keystore

  - name: Restore Release Upload Keystore
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    run: |
      set -euo pipefail

      if [ -z "${KEYSTORE_BASE64:-}" ]; then
        echo "::error::Missing KEYSTORE_BASE64 GitHub secret."
        exit 1
      fi

      printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      if [ ! -s my-upload-key.jks ]; then
        echo "::error::Release keystore is empty."
        exit 1
      fi

      chmod 600 my-upload-key.jks

  - name: Verify Release Signing Configuration
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    run: |
      set -euo pipefail

      test -n "${STORE_PASSWORD:-}" || {
        echo "::error::Missing STORE_PASSWORD secret."
        exit 1
      }

      test -n "${KEY_PASSWORD:-}" || {
        echo "::error::Missing KEY_PASSWORD secret."
        exit 1
      }

      test -n "${KEY_ALIAS:-}" || {
        echo "::error::Missing KEY_ALIAS secret."
        exit 1
      }

      keytool -list \
        -keystore my-upload-key.jks \
        -storepass "$STORE_PASSWORD" \
        -alias "$KEY_ALIAS" > /dev/null

      echo "Release signing keystore and alias verified."

  - name: Setup Environment Configuration
    run: |
      if [ ! -f .env ] && [ -f .env.example ]; then
        cp .env.example .env
      fi

  - name: Run Unit & Robolectric Tests
    run: ./gradlew testDebugUnitTest --stacktrace

  - name: Build Debug APK and Signed Release AAB
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    run: |
      set -euo pipefail
      ./gradlew assembleDebug bundleRelease --stacktrace

  - name: Stage Build Artifacts
    run: |
      set -euo pipefail
      mkdir -p ci-artifacts

      DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
      RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"

      test -s "$DEBUG_APK"
      test -s "$RELEASE_AAB"

      cp "$DEBUG_APK" ci-artifacts/AudioFactory-debug.apk
      cp "$RELEASE_AAB" ci-artifacts/AudioFactory-release.aab

      echo "Build artifacts:"
      ls -lh ci-artifacts/

  - name: Upload APK and Release AAB
    uses: actions/upload-artifact@v4
    with:
      name: audiofactory-android-builds
      path: ci-artifacts/*
      if-no-files-found: error
      retention-days: 14

  - name: Upload Test Reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: audiofactory-test-reports
      path: app/build/reports/tests/
      if-no-files-found: ignore
      retention-days: 7

  - name: Cleanup Sensitive Files
    if: always()
    run: |
      rm -f app/google-services.json my-upload-key.jks
