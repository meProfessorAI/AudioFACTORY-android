name: AudioFACTORY CI Build and Test Validation

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: audiofactory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Android Build and Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # 5. Restore and validate Firebase configuration
      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 repository secret."
            exit 1
          fi

          mkdir -p app

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > app/google-services.json

          test -s app/google-services.json

          python3 - <<'PY'
          import json

          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)

          assert config["project_info"]["project_id"] == "audiofactory-eia", (
              "Firebase project ID does not match audiofactory-eia"
          )

          matching = [
              client for client in config["client"]
              if client["client_info"]["android_client_info"]["package_name"]
              == "com.audiofactory.app"
          ]

          assert matching, "Firebase Android package not found"

          web_clients = [
              oauth
              for client in matching
              for oauth in client.get("oauth_client", [])
              if oauth.get("client_type") == 3
          ]

          assert web_clients, "Firebase Web OAuth client is missing"

          print("Firebase configuration verified successfully.")
          PY

      # 6. Restore debug signing key
      - name: Restore Debug Keystore
        run: |
          set -euo pipefail

          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore

          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s debug.keystore

          echo "Debug keystore ready."

      # 7. Restore release upload keystore
      - name: Restore Release Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > my-upload-key.jks

          test -s my-upload-key.jks
          chmod 600 my-upload-key.jks

          echo "Release upload keystore restored."

      # 8. Verify release signing credentials
      - name: Verify Release Signing
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "${STORE_PASSWORD:-}" || {
            echo "::error::STORE_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "::error::KEY_PASSWORD is missing."
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "::error::KEY_ALIAS is missing."
            exit 1
          }

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Release signing credentials verified."

      # 9. Configure environment
      - name: Configure Environment
        run: |
          set -euo pipefail

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 10. Verify build environment
      - name: Verify Build Environment
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

          echo "Gradle version:"
          ./gradlew --version

      # 11. Validate Gradle configuration
      - name: Validate Gradle Configuration
        run: ./gradlew tasks --stacktrace

      # 12. Run unit and Robolectric tests
      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 13. Build debug APK and release AAB
      - name: Build Debug APK and Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            assembleDebug \
            bundleRelease \
            --stacktrace

      # 14. Verify APK and AAB signatures
      - name: Verify Build Signatures
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_AAB"

          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          jarsigner -verify -verbose -certs "$RELEASE_AAB" \
            > aab-verification.txt 2>&1 || {
              cat aab-verification.txt
              exit 1
            }

          if ! grep -qi 'jar verified' aab-verification.txt; then
            cat aab-verification.txt
            echo "::error::Release AAB signature verification failed."
            exit 1
          fi

          echo "Debug APK and release AAB signatures verified."

      # 15. Stage build artifacts
      - name: Stage Build Artifacts
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts

          cp app/build/outputs/apk/debug/app-debug.apk \
            ci-artifacts/AudioFactory-debug.apk

          cp app/build/outputs/bundle/release/app-release.aab \
            ci-artifacts/AudioFactory-release.aab

          echo "Generated artifacts:"
          ls -lh ci-artifacts/

      # 16. Upload APK and AAB
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Android-Builds
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # 17. Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioFACTORY-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # 18. Cleanup sensitive files
      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f my-upload-key.jks
          rm -f aab-verification.txt
